spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  email-template:
    verify-email-template: Hi %s,<br/><br/> Welcome to Appointment System.To complete registration process click <a href='%s'>here</a> to verify your account.<br/></br/><br/><br/> %s
    reset-password-email-template: Hi %s,<br/><br/> We have received your request to reset your password.Please click <a href='%s'>here</a> to reset your password.<br/></br/><br/> %s
  cors:
    allowed-origins:
      - http://localhost:4200
    allowed-methods:
      - POST
      - GET
      - PUT
      - OPTIONS
      - DELETE
      - PATCH
    allowed-headers:
      - "*"
    max-age: 3600
  white-list:
    - "/auth-service/v3/api-docs/**"
    - "/auth-service/swagger-ui/**"
    - "/api/v1/auth/**"
  custom-exposed-endpoints:
    - "/api/v1/auth/**"
  open-api:
    info:
      title: Appointment Auth Service
      description: Appointment Authentication Service
      version: 1.0.0
  verification-token:
    expiration-ms: 86400000
  kafka:
    notification-topic: ${infrastructure.ENV}-appointment-notifications
  encryption-key: "encryption key"
  registered-clients:
    -
      # Public Client for UI
      client-id: appointment-ui-client
      client-authentication-methods:
        - "none"
      authorization-grant-types:
        - "authorization_code"
        - "refresh_token"
      redirect-uris:
        - "${app.client-url}/callback"
      post-logout-redirect-uris:
        - "${app.client-url}/account/sign-out"
      scopes:
        - "openid"
        - "profile"
        - "email"
      client-settings:
        require-proof-of-key: true
      token-setting:
        access-token-time-to-live: 120 # in minutes
        refresh-token-time-to-live: 1 # in days
  client-url: http://localhost:4200


grpc:
  server:
    port: 9090
